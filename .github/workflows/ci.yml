name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend - install & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app-backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (if present)
        run: |
          if npm run | grep -q "test"; then npm test --if-present; else echo "No tests"; fi

  frontend:
    name: Frontend - install & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (if present)
        run: |
          if npm run | grep -q "test"; then npm test -- --watchAll=false || true; else echo "No tests"; fi
